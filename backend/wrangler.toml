name = "sao-recruitment-backend"
main = "src/index.ts"
compatibility_date = "2026-10-07"
compatibility_flags = ["nodejs_compat"]

# ── Attachment Lifecycle (Migration 029) ──
# Cron GC: ลบไฟล์ TEMP (ไม่ถูก submit) อายุเกิน 7 วัน วันละครั้ง
# 18:00 UTC = 01:00 น. เวลาไทย (Asia/Bangkok, UTC+7)
[triggers]
crons = ["0 18 * * *"]

# PDF V1 assets are base64-inlined via scripts/build-assets.ts
# (auto-run before dev/build/deploy via package.json prebuild/predev hooks)
# No build rules needed — Wrangler 3 / esbuild bundles TS string literals directly.


# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "sao-db"
database_id = "c8c9e923-0b64-4203-880b-ea5af58d316f"

[[d1_databases]]
binding = "DB_LOCAL"
database_name = "sao-db-local"
database_id = "3c2afb74-3a5d-4adb-8f58-d2077e4b462f"

# R2 Bucket Binding
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "sao-storage"

# =============================================================================
# Observability (Workers Logs)
# =============================================================================
# เปิด Workers Logs ให้ backend — เดียวกับ frontend (frontend/wrangler.jsonc)
#
# เหตุผล: audit เคยพบว่าไม่มี visibility ของ backend runtime เลย
#   - audit_logs เก็บเฉพาะ action ที่ระบบบันทึก (ไม่ครอบคลุม error/latency)
#   - เกิดเหตุการณ์จริงใน production เมื่อ 2026-10-28 (เช่น PDF / upload)
#     ไม่มีทางย้อนดู log ของ request ที่เกี่ยวข้อง
#
# ตัวเลือก:
#   enabled = true
#     → เปิดทั้ง invocation logs + trace logs (Worker traces)
#   head_sampling_rate = 1
#     → เก็บ 100% ของ request (ค่า default ของ Cloudflare)
#       ปรับเป็น 0.1 (10%) ถ้า volume สูงเกินจนอยากลด log retention cost
#
# ⚠️ ข้อควรระวัง: Workers Logs จะเก็บ request metadata + console output
#    ห้าม log ข้อมูลอ่อนไหว (national_id, password, token) — ดูระเบียบ redaction
#    ใน backend/src/middlewares/ (audit.middleware.ts, auth.middleware.ts)
#
# ✅ สถานะ: เปิดแล้วทั้งใน config นี้และฝั่ง dashboard
#    (ยืนยันจาก Cloudflare API scripts/settings — logs.persist = true)
#    ไม่ต้องไปกด Enable ที่ dashboard อีก
# =============================================================================
[observability]
enabled = true
head_sampling_rate = 1

# ===========================================
# OPTIONAL: Cloudflare Queue (ปิดไว้ชั่วคราว)
# หากต้องการเปิดใช้งาน Queue สำหรับ PDF Generation:
# 1. สร้าง Queue: wrangler queues create sao-pdf-queue
# 2. Uncomment config ด้านล่าง
# 3. เพิ่ม PDF_QUEUE กลับเข้าไปใน Bindings type
# ===========================================
# [[queues.producers]]
# binding = "PDF_QUEUE"
# queue = "sao-pdf-queue"
#
# [[queues.consumers]]
# queue = "sao-pdf-queue"
# max_batch_size = 10
# max_batch_timeout = 5

[vars]
# ตัวแปรเหล่านี้ตั้งค่าผ่าน .env หรือ Cloudflare Dashboard สำหรับ Production

# =============================================================================
# PR #1 - Hardening / Anti-bot foundation
# =============================================================================
# All flags below have safe defaults applied at the call site. The values
# shown here are *documentation* — the runtime will read either these
# [vars] values OR (preferred for production) values set in the
# Cloudflare Dashboard. The middleware layer also accepts missing values
# without crashing, so a fresh deploy is always functional.
#
#  HONEYPOT_FIELD_NAME       Hidden form field checked by honeypot middleware.
#                            Default: "website_url" if unset.
#  RATE_LIMIT_ENABLED        Per-IP rate limiter master switch. Default: true.
#  RATE_LIMIT_PER_MINUTE     Max requests per minute per IP. Default: 5.
#  RATE_LIMIT_LOOKUP_PER_MINUTE Max lookup requests per minute per IP. Default: 30.
#  IDEMPOTENCY_ENABLED       Idempotency-token master switch. Default: true.
#  IDEMPOTENCY_TTL_SECONDS   Token TTL in seconds. Default: 900 (15 min).
#  TURNSTILE_ENABLED         Cloudflare Turnstile widget switch. Default: false.
#  TURNSTILE_SITE_KEY        Public site key served via /public/config.
#  TURNSTILE_SECRET_KEY      Server-side secret for token verification
#                            (not used in PR #1; verification is out of scope).
# =============================================================================
HONEYPOT_FIELD_NAME = "website_url"
RATE_LIMIT_ENABLED = "true"
RATE_LIMIT_PER_MINUTE = "5"
RATE_LIMIT_LOOKUP_PER_MINUTE = "30"
IDEMPOTENCY_ENABLED = "true"
IDEMPOTENCY_TTL_SECONDS = "900"

TURNSTILE_ENABLED = "true"
TURNSTILE_SITE_KEY = "0x4AAAAAAFXbx0CnT46cGCxm"