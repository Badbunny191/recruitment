name = "sao-recruitment-backend"
main = "src/index.ts"
compatibility_date = "2026-10-07"
node_compat = true

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "sao-db"
database_id = "c8c9e923-0b64-4203-880b-ea5af58d316f" # ใส่ ID จริงหลังจากสร้างด้วยคำสั่ง wrangler d1 create

# R2 Bucket Binding
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "sao-storage"

# Queues Binding
[[queues.producers]]
binding = "PDF_QUEUE"
queue = "sao-pdf-queue"

[[queues.consumers]]
queue = "sao-pdf-queue"
max_batch_size = 10
max_batch_timeout = 5

[vars]
# ตัวแปรเหล่านี้ตั้งค่าผ่าน .env หรือ Cloudflare Dashboard สำหรับ Production
JWT_SECRET = "REPLACE_WITH_SUPER_SECRET_KEY"